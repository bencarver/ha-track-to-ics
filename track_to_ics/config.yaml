name: "Track to ICS Calendar"
description: "Downloads reservations from Track Property Management and serves them as an ICS calendar for Rental Control"
version: "1.0.8"
slug: "track_to_ics"
init: false
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ports:
  8099/tcp: 8099
  8443/tcp: 8443
ports_description:
  8099/tcp: "HTTP Web Server (for ingress)"
  8443/tcp: "HTTPS Web Server (for Rental Control)"
options:
  track_username: ""
  track_password: ""
  track_base_url: "https://fivestarproperty.trackhs.com"
  export_path: "/owner/reservations/generate-csv/"
  refresh_interval_minutes: 30
  checkin_time: "16:00"
  checkout_time: "11:00"
  timezone: "America/Denver"
  include_owner_stays: false
  include_past_reservations: false
  notify_on_error: true
  notify_cooldown_minutes: 15
schema:
  track_username: str
  track_password: password
  track_base_url: url
  export_path: str
  refresh_interval_minutes: int(5,1440)
  checkin_time: str
  checkout_time: str
  timezone: str
  include_owner_stays: bool
  include_past_reservations: bool
  notify_on_error: bool
  notify_cooldown_minutes: int(1,1440)
webui: "http://[HOST]:[PORT:8099]/"
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-export
homeassistant_api: true
